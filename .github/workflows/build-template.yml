name: Build Mini-Game WASM Template

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: "Exact Godot tag, for example 4.7.2-stable"
        required: true
        type: string
        default: "4.7.2-stable"
      emscripten_version:
        description: "Exact Emscripten SDK version"
        required: true
        type: string
        default: "4.0.11"
      template_revision:
        description: "Immutable template revision"
        required: true
        type: string
        default: "3"
      profile:
        description: "Engine profile, matching scripts/engine_profiles/<name>.py"
        required: true
        type: string
        default: "2d_full"
      publish_release:
        description: "Publish after every validation passes"
        required: true
        type: boolean
        default: false
  # Pushing an `engine/**` branch is the no-CLI way to request a rebuild: the
  # build job compiles and validates the exact template, then the
  # `sync-engine-files` job commits the certified engine back to that branch.
  # The branch name selects the engine profile: `engine/minigame` builds the
  # `minigame` cut.
  push:
    branches:
      - "engine/**"
    # The write-back job commits the certified engine back to the branch.
    # Those files must not trigger another rebuild of the same engine.
    paths-ignore:
      - "addons/godot_mini_game/engine/**"
      - "addons/godot_mini_game/GODOT_COPYRIGHT.txt"
      - "support-matrix.json"
      - "website/app/site-data.generated.ts"
      - "README.md"
      - "README_zh.md"
      - "scripts/release_plugin.sh"
      - "test/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    outputs:
      bundle_name: ${{ steps.bundle.outputs.name }}
      bundle_path: ${{ steps.bundle.outputs.path }}
    env:
      GODOT_TAG: ${{ inputs.godot_version || '4.7.2-stable' }}
      EMSDK_VERSION: ${{ inputs.emscripten_version || '4.0.11' }}
      TEMPLATE_REVISION: ${{ inputs.template_revision || '3' }}
      BUILD_TARGET: release
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Resolve the engine profile
        id: profile
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            branch="${{ github.ref_name }}"
            case "$branch" in
              engine/*) profile="${branch#engine/}" ;;
              *)
                echo "::error::An engine build must be requested from an engine/<name> branch" >&2
                exit 1
                ;;
            esac
          else
            profile="${{ inputs.profile }}"
          fi
          if ! [[ "$profile" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid engine profile name: $profile" >&2
            exit 1
          fi
          if [ ! -s "scripts/engine_profiles/${profile}.py" ]; then
            echo "::error::Unknown engine profile: $profile" >&2
            echo "Known profiles:" >&2
            ls scripts/engine_profiles >&2
            exit 1
          fi
          echo "Building engine profile: $profile"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"

      - name: Validate immutable inputs
        id: contract
        run: |
          set -euo pipefail
          if ! [[ "$GODOT_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z]+$ ]]; then
            echo "Godot tag must be exact, for example 4.7.2-stable: $GODOT_TAG" >&2
            exit 1
          fi
          if ! [[ "$EMSDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Emscripten SDK version must be exact, for example 4.0.11: $EMSDK_VERSION" >&2
            exit 1
          fi
          if ! [[ "$TEMPLATE_REVISION" =~ ^[1-9][0-9]*$ ]]; then
            echo "Template revision must be a positive integer: $TEMPLATE_REVISION" >&2
            exit 1
          fi
          bridge_abi=$(jq -er '.bridgeAbi | select(type == "number" and . > 0 and (. % 1 == 0))' support-matrix.json)
          template_schema=$(jq -er '.templateSchema | select(type == "number" and . > 0 and (. % 1 == 0))' support-matrix.json)
          profile_tag="${PROFILE//_/-}"
          release_tag="template-${GODOT_TAG}-emsdk-${EMSDK_VERSION}-${profile_tag}-release-abi-${bridge_abi}-r${TEMPLATE_REVISION}"
          echo "bridge_abi=$bridge_abi" >> "$GITHUB_OUTPUT"
          echo "template_schema=$template_schema" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

        env:
          PROFILE: ${{ steps.profile.outputs.profile }}

      - name: Checkout exact Godot source tag
        uses: actions/checkout@v7
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_TAG }}
          path: godot-src

      - name: Verify source identity
        id: source
        working-directory: godot-src
        run: |
          set -euo pipefail
          actual_tag=$(git describe --tags --exact-match)
          if [ "$actual_tag" != "$GODOT_TAG" ]; then
            echo "Checked-out tag $actual_tag does not match requested version $GODOT_TAG" >&2
            exit 1
          fi
          test -z "$(git status --porcelain --untracked-files=all)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSDK_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build and validation tools
        run: |
          pip install scons==4.9.1
          sudo apt-get update
          sudo apt-get install -y brotli jq wabt

      # The build, the packaging, the godot.js anchor audit and the manifest
      # verification all live in scripts/build_wasm_template.sh so the local
      # build and this workflow can never drift apart.
      - name: Build and package the certified template
        id: bundle
        env:
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
          GODOT_SOURCE_DIR: ${{ github.workspace }}/godot-src
        run: |
          set -euo pipefail
          output_dir="${{ github.workspace }}/engine-bundle"
          mkdir -p "$output_dir"
          scripts/build_wasm_template.sh "$GODOT_TAG" "$EMSDK_VERSION" "$output_dir"
          bundle="$(find "$output_dir" -maxdepth 1 -name '*.zip' -print -quit)"
          if [ -z "$bundle" ]; then
            echo "::error::The build did not produce a template bundle" >&2
            exit 1
          fi
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${bundle%.zip}")" >> "$GITHUB_OUTPUT"

      - name: Upload validated artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: |
            ${{ steps.bundle.outputs.path }}
            ${{ steps.bundle.outputs.path }}.sha256

      - name: Refuse mutable template release
        if: inputs.publish_release
        env:
          RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
        run: |
          set -euo pipefail
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Template tag $RELEASE_TAG already exists locally and is immutable" >&2
            exit 1
          fi
          if ! remote_refs=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}"); then
            echo "Unable to verify whether remote template tag $RELEASE_TAG exists" >&2
            exit 1
          fi
          if [ -n "$remote_refs" ]; then
            echo "Template tag $RELEASE_TAG already exists remotely and is immutable" >&2
            exit 1
          fi

      - name: Publish validated template release
        if: inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.contract.outputs.release_tag }}
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
          GODOT_COMMIT: ${{ steps.source.outputs.commit }}
          BRIDGE_ABI: ${{ steps.contract.outputs.bridge_abi }}
          TEMPLATE_SCHEMA: ${{ steps.contract.outputs.template_schema }}
          BUILD_PROFILE: ${{ steps.profile.outputs.profile }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "$BUNDLE_PATH" \
            "${BUNDLE_PATH}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Mini-Game Template ${GODOT_TAG} / Emscripten ${EMSDK_VERSION} / ABI ${BRIDGE_ABI} / r${TEMPLATE_REVISION}" \
            --notes "Validated profile=${BUILD_PROFILE}, target=${BUILD_TARGET}, templateSchema=${TEMPLATE_SCHEMA}. Exact Godot source commit: ${GODOT_COMMIT}."

  # Commits the freshly certified engine back into the requesting `engine/**`
  # branch so a later `vX.Y.Z` tag can package it. This is what lets the engine
  # rebuild happen without a local toolchain and without a manual download.
  sync-engine-files:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli jq wabt

      - name: Download validated template bundle
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: engine-bundle

      - name: Install the certified engine into the plugin tree
        run: |
          set -euo pipefail
          bundle="$(find engine-bundle -name '*.zip' -print -quit)"
          test -n "$bundle"
          bash scripts/install_engine_template.sh "$bundle"
          rm -rf engine-bundle

      - name: Keep README template revision in lockstep
        run: |
          set -euo pipefail
          revision="$(jq -er '.certified[] | select(.template.source == "bundled") | .templateRevision' support-matrix.json)"
          profile="$(jq -er '.certified[] | select(.template.source == "bundled") | .profile' support-matrix.json)"
          # Keep every backtick inside a quoted string. An unquoted one opens a
          # command substitution and makes the whole step fail to parse.
          bt='`'
          sed -i -E "s/revision ${bt}[0-9]+${bt}/revision ${bt}${revision}${bt}/g" README.md README_zh.md
          sed -i -E "s/^(\| Build \| )${bt}[^${bt}]+${bt}/\1${bt}${profile}${bt}/" README.md
          sed -i -E "s/^(\| 构建 \| )${bt}[^${bt}]+${bt}/\1${bt}${profile}${bt}/" README_zh.md

      - name: Commit and push the certified engine
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Bundled engine already matches the certified template."
            exit 0
          fi
          revision="$(jq -er '.certified[] | select(.template.source == "bundled") | .templateRevision' support-matrix.json)"
          profile="$(jq -er '.certified[] | select(.template.source == "bundled") | .profile' support-matrix.json)"
          git config user.name "godot-mini-game-bot"
          git config user.email "godot-mini-game-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(engine): install certified ${profile} template r${revision}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
