name: Release Plugin

on:
  push:
    tags:
      - "v*"

jobs:
  smoke:
    uses: ./.github/workflows/smoke-test-export.yml

  package:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        id: version
        run: |
          set -euo pipefail
          facts="$(scripts/validate_release_tag.sh "$GITHUB_REF_NAME")"
          echo "$facts"
          while IFS='=' read -r key value; do
            [ -n "$key" ] || continue
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done <<<"$facts"

      - name: Refuse an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if response="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>&1)"; then
            echo "Release $GITHUB_REF_NAME already exists and is immutable" >&2
            exit 1
          fi
          if ! printf '%s\n' "$response" | grep -q 'HTTP 404'; then
            echo "Unable to verify whether release $GITHUB_REF_NAME exists:" >&2
            printf '%s\n' "$response" >&2
            exit 1
          fi

      - name: Package plugin
        run: scripts/package_plugin.sh "${{ steps.version.outputs.package_name }}"

      - name: Verify install archive
        run: |
          set -euo pipefail
          archive="dist/${{ steps.version.outputs.package_name }}.zip"
          unzip -t "$archive"
          unzip -l "$archive" | grep 'addons/godot_mini_game/LICENSE'
          unzip -l "$archive" | grep 'addons/godot_mini_game/GODOT_COPYRIGHT.txt'
          unzip -l "$archive" | grep 'addons/godot_mini_game/THIRD_PARTY_NOTICES.md'
          unzip -l "$archive" | grep 'addons/godot_mini_game/engine/template.json'
          unzip -l "$archive" | grep 'addons/godot_mini_game/plugin.cfg'
          test -s "${archive}.sha256"
          archive_name=$(basename "$archive")
          (cd "$(dirname "$archive")" && sha256sum -c "${archive_name}.sha256")

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "${{ steps.version.outputs.tag }}"
          body: |
            ## Godot Mini Game Plugin ${{ steps.version.outputs.tag }}

            - Godot target: `${{ steps.version.outputs.godot_tag }}`
            - Plugin version: `${{ steps.version.outputs.plugin_version }}`
            - Mod iteration: `${{ steps.version.outputs.iteration }}`
            ${{ steps.version.outputs.engine_name && format('- Engine cut: `{0}` (iteration {1})', steps.version.outputs.engine_name, steps.version.outputs.engine_iteration) || '' }}
            - Transactional mini-game export with version-locked engine templates.
            - WeChat, Douyin, and TikTok platform runtimes with a shared bridge ABI.
            - Bundled certified engine template for the exact version listed in `support-matrix.json`.

            Download the installable ZIP below and extract it into the root of a Godot project.
          files: |
            dist/${{ steps.version.outputs.package_name }}.zip
            dist/${{ steps.version.outputs.package_name }}.zip.sha256
          draft: false
          prerelease: false
